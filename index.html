
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Change Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    
  </head>
  <body class="bg-secondary">
    <h1 class="text-center">Change Calculator</h1>
    <div class="container" style="max-width: 1800px;">
    <div class="row justify-content-center mt-4 ">
  <div class="col-sm-3 col-md-4 mb-3 mb-sm-0">
    <div class="card border border-dark ">
      <div class="card-body text-center">
        <h5 class="card-title">Amount Due:</h5>
        <input id="amount-due" type="text" placeholder="Due"/>
      </div>
    </div>
  </div>
  <div class="col-sm-3 col-md-4 mb-3 mb-sm-0">
    <div class="card border border-dark">
      <div class="card-body text-center">
        <h5 class="card-title">Amount Received:</h5>
          <input id="amount-received" type="text" placeholder="Received"/>
      </div>
    </div>
  </div>
</div>
</div>
    


   <div class="d-grid gap-2 col-4 mx-auto mt-3 mb-5">
    <button id="calculate-change" 
  class="btn btn-success"
  style="color: black;"
  onmouseover="this.style.backgroundColor='#39ff14'" 
  onmouseout="this.style.backgroundColor=''">Calculate Change!</button>
   </div>
    

    <div class="container text-center p-2 mb-5 mt-5 " style="width: 20rem;" >
      <div class="card p-2 border border-dark">
        <div>
          <h3 class="card-title">Change: </h3>
          <p class="card-body" id="result"></p>
        </div>
      </div>
    </div>
    <div class="container text-center mt-5">
  <div class="row column gap-2">

    <div class="card col p-2  border border-dark">
      <img src="dollar.png" class="card-img-top" alt="dollar_png">
      <div class="card-body">
        <h3 class="card-title">Dollars: </h3>
        <p class="card-body" id="dollars-output"></p>
      </div>
      
    </div>

    <div class="card col p-2 border border-dark " >
      <img src="quarter.png" class="card-img-top" alt="quarter_png">
      <div class="card-body">
      <h3 class="card-title">Quarters: </h3>
      <p class ="card-body" id="quarters-output">  </p>
      </div>
    </div>

    <div class="card col p-2 border border-dark ">
      <img src="dime.png" class="card-img-top" alt="dime_png">
      <div class="card-body">
        <h3 class="card-title">Dimes: </h3>
        <p class="card-body" id="dimes-output"></p>
      </div>
      
    </div>
    <div class="card col p-2 border border-dark ">
      <img src="nickel.png" class="card-img-top" alt="nickel_png">
      <div class="card-body">
        <h3 class="card-title">Nickels: </h3>
        <p class="card-body" id="nickels-output"></p>
      </div>
      
    </div>
    <div class="card col p-2 border border-dark ">
      <img src="penny.png" class="card-img-top" alt="penny_png">
      <div class="card-body">
        <h3 class="card-title">Pennies: </h3>
        <p class="card-body" id="pennies-output"></p>
      </div>
      
    </div>
  </div>
</div>

    <!-- Write your markup here -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="main.js"></script>
    <!-- Don't forget to add your <script> tag here -->

  </body>
</html>
